<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SANTA RUN V3.9</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="account" aria-label="Google 계정">
<div id="googleButton"></div>
<div id="profile" class="hidden"><img id="profilePicture" alt=""><span id="profileName"></span></div>
<button id="signOutBtn" class="hidden" type="button">로그아웃</button>
</div>
<p id="loginStatus" class="hidden" role="status" aria-live="polite"></p>
<div id="hud" class="hidden">SCORE <span id="score">0</span><br>BEST <span id="best">0</span><br>PRESENT <span id="present">0</span><br>COINS <span id="coins">0</span><br>LEVEL <span id="level">1</span></div>
<div id="stageLabel" class="hidden"></div>
<button id="pauseBtn" class="hidden secondary">Ⅱ PAUSE</button>
<div id="comboLabel" class="hidden"></div><div id="effectLabel" class="hidden"></div>
<div id="missionHUD" class="hidden"></div>
<div id="touchLabels" class="hidden"><span>← PRESENT</span><span>HOLD TO JUMP →</span></div>
<div id="hint" class="hidden">왼쪽: 선물 발사 · 오른쪽: 점프</div>
<div id="message"></div>
<script src="game.js" defer></script>
</body>
</html>
